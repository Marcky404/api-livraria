spring:
  datasource:
    username: admin
    password: admin
    url: jdbc:postgresql://localhost:5432/livraria
    driverClassName: org.postgresql.Driver
    initialization-mode: always
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

endpoint:
  cep: https://viacep.com.br/ws/
